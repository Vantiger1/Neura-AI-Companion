<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neura Companion Dashboard (3D)</title>
  <style>
    body { margin:0; overflow:hidden; font-family:Arial,sans-serif; }
    #three-canvas { display:block; width:100%; height:100vh; }
    #ui-overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    #client-area, #controls { pointer-events:auto; }
    .btn{ padding:8px 12px; cursor:pointer; pointer-events:auto; margin:4px; }
    #bpm-control { display:flex; align-items:center; gap:5px; }
    #bpm-input { width:60px; }
    .popup { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,0.9); padding:20px; border-radius:8px; backdrop-filter:blur(10px); }
    .popup h3 { margin-top:0; }
  </style>
</head>
<body>
  <canvas id="three-canvas"></canvas>
  <div id="ui-overlay">
    <!-- Client area -->
    <div id="client-area" style="position:absolute; bottom:20px; left:20px; display:flex; gap:10px;">
      <button class="btn" data-client="A">Client A</button>
      <button class="btn" data-client="B">Client B</button>
      <button class="btn" data-client="C">Client C</button>
    </div>
    <!-- Controls -->
    <div id="controls" style="position:absolute; top:20px; right:20px; display:flex; flex-direction:column; background:rgba(0,0,0,0.5); padding:10px; border-radius:8px;">
      <button class="btn" data-env="lights">Toggle Lights</button>
      <button class="btn" data-env="thermostat">Set Temp</button>
      <button class="btn" data-env="music">Toggle Music</button>
      <button class="btn" data-widget="calendar">Open Calendar</button>
      <button class="btn" data-widget="analytics">Show Analytics</button>
      <div id="bpm-control">
        <label for="bpm-input" style="color:#fff;">BPM:</label>
        <input type="number" id="bpm-input" min="60" max="200" value="120" />
      </div>
    </div>
    <!-- Popups -->
    <div id="popup-calendar" class="popup">
      <h3>Calendar</h3>
      <div id="calendar-content">[Monthly view placeholder]</div>
      <button class="btn" id="close-calendar">Close</button>
    </div>
    <div id="popup-analytics" class="popup">
      <h3>Analytics</h3>
      <canvas id="analytics-chart" width="360" height="200"></canvas>
      <button class="btn" id="close-analytics">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/controls/OrbitControls.js';

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Lights
    const ambient = new THREE.AmbientLight(0x555555);
    const directional = new THREE.DirectionalLight(0xffffff, 0.8);
    directional.position.set(5, 10, 5);
    scene.add(ambient, directional);

    // Load 3D dashboard
    const loader = new GLTFLoader();
    const mixers = [];
    loader.load('models/penthouse_dashboard.glb', gltf => {
      const model = gltf.scene;
      scene.add(model);
      const mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach(clip => mixer.clipAction(clip));
      mixers.push(mixer);
    });

    // Camera & controls
    camera.position.set(0, 2, 5);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Raycasting for widget popups
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);
      if (intersects.length) {
        const name = intersects[0].object.name;
        if (name === 'Widget_Calendar') document.getElementById('popup-calendar').style.display = 'block';
        if (name === 'Widget_Analytics') { document.getElementById('popup-analytics').style.display = 'block'; renderAnalyticsChart(); }
      }
    }
    window.addEventListener('click', onClick);

    // Animation loop
    const clock = new THREE.Clock();
    (function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      mixers.forEach(m => m.update(delta));
      controls.update();
      renderer.render(scene, camera);
    })();

    // Popup close handlers
    document.getElementById('close-calendar').onclick = () => document.getElementById('popup-calendar').style.display = 'none';
    document.getElementById('close-analytics').onclick = () => document.getElementById('popup-analytics').style.display = 'none';

    // Chart.js
    function renderAnalyticsChart() {
      const ctx = document.getElementById('analytics-chart').getContext('2d');
      new Chart(ctx, { type: 'bar', data: { labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], datasets: [{ label: 'Usage', data: [12,19,3,5,2,3,7] }] } });
    }

    // AI stubs for control (replace with real endpoints)
    function callNeuraAI(event, data) { console.log('AI event', event, data); }

    // UI button hooks to show popups or trigger AI
    document.querySelector('[data-env="lights"]').onclick = () => callNeuraAI('toggleLights');
    document.querySelector('[data-env="thermostat"]').onclick = () => callNeuraAI('setThermostat');
    document.querySelector('[data-env="music"]').onclick = () => callNeuraAI('toggleMusic');
    document.querySelector('[data-widget="calendar"]').onclick = () => document.getElementById('popup-calendar').style.display = 'block';
    document.querySelector('[data-widget="analytics"]').onclick = () => { document.getElementById('popup-analytics').style.display = 'block'; renderAnalyticsChart(); };

    document.querySelectorAll('[data-client]').forEach(btn => btn.onclick = () => callNeuraAI('greetClient', { client: btn.dataset.client }));

    window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  </script>
</body>
</html>
