name: Neura Companion CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            %LOCALAPPDATA%\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Ensure PowerShell 7 available (Ubuntu)
        if: runner.os == 'Linux'
        run: pwsh --version

      - name: Run fix & optimize (strict, multi-target)
        shell: pwsh
        run: |
          pwsh -File scripts/tools/fix_and_optimize.ps1 -BuildTargets apk,appbundle,web -Strict -SkipTests

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neura-ci-${{ matrix.os }}
          path: |
            build/ci_artifacts/**
          if-no-files-found: warn
